---
apiVersion: v1
kind: Namespace
metadata:
  name: medverify
  labels:
    app.kubernetes.io/name: medverify
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medverify-backend
  namespace: medverify
data:
  ENVIRONMENT: "production"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  SQLALCHEMY_DATABASE_URL: "postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
---
apiVersion: v1
kind: Secret
metadata:
  name: medverify-secrets
  namespace: medverify
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_SECURE_SECRET_KEY_32_CHARS"
  DB_PASSWORD: "REPLACE_WITH_SECURE_DB_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_SECURE_REDIS_PASSWORD"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medverify-backend
  namespace: medverify
  labels:
    app: medverify
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medverify
      component: backend
  template:
    metadata:
      labels:
        app: medverify
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/medverify/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: medverify-backend
            - secretRef:
                name: medverify-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: rsa-keys
              mountPath: /app/keys
              readOnly: true
      volumes:
        - name: rsa-keys
          secret:
            secretName: medverify-rsa-keys
---
apiVersion: v1
kind: Service
metadata:
  name: medverify-backend
  namespace: medverify
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: medverify
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medverify-frontend
  namespace: medverify
  labels:
    app: medverify
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medverify
      component: frontend
  template:
    metadata:
      labels:
        app: medverify
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/medverify/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: medverify-frontend
  namespace: medverify
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: medverify
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medverify-postgres
  namespace: medverify
  labels:
    app: medverify
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medverify
      component: database
  template:
    metadata:
      labels:
        app: medverify
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: medverify-backend
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: medverify-backend
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medverify-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: medverify-postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medverify-postgres-pvc
  namespace: medverify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: medverify-postgres
  namespace: medverify
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: medverify
    component: database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medverify-redis
  namespace: medverify
  labels:
    app: medverify
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medverify
      component: cache
  template:
    metadata:
      labels:
        app: medverify
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medverify-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: medverify-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medverify-redis-pvc
  namespace: medverify
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: medverify-redis
  namespace: medverify
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: medverify
    component: cache
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medverify-ingress
  namespace: medverify
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - medverify.example.com
      secretName: medverify-tls
  rules:
    - host: medverify.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: medverify-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: medverify-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: medverify-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medverify-frontend
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medverify-backend-pdb
  namespace: medverify
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: medverify
      component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medverify-backend-hpa
  namespace: medverify
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medverify-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
