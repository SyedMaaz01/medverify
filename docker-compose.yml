version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medverify-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-medverify}
      POSTGRES_USER: ${DB_USER:-medverify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medverify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medverify} -d ${DB_NAME:-medverify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medverify-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: medverify-backend
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-medverify}
      - DB_USER=${DB_USER:-medverify}
      - DB_PASSWORD=${DB_PASSWORD:-medverify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SQLALCHEMY_DATABASE_URL=postgresql+asyncpg://${DB_USER:-medverify}:${DB_PASSWORD:-medverify}@postgres:5432/${DB_NAME:-medverify}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: medverify-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: medverify-network